<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>low cost not shooting game sim</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>

<body>
  <div id="game-root" style="background-size: contain; width: 100%; height: 100%;">
    <div style="margin: auto; height: 100%; display: flex; perspective-origin: center bottom; perspective: 540px; overflow: hidden;">
      <canvas width="1080" height="1920"
        style="width: 100%; height: 100%; object-fit: contain; transform: rotateX(15deg) rotateY(0deg) rotateZ(0deg);transform-origin: center top; transform-style: preserve-3d; transition: 0.166s linear;"></canvas>
    </div>
    <div id="scene-play-UI"
      style="position: absolute; width: 100%; height: 100%; z-index: 1;display: flex; flex-direction: column; contain: content; top: 0;">

    </div>
  </div>
  <script src="js/UI/_UIBase.js"></script>
  <script src="js/UI/UIBase.js"></script>
  <script src="js/UntitledChart.js"></script>
  <script src="js/UntitledShootingGame.js"></script>
  <script>
    const game = new UntitledShootingGame({
      canvas: document.querySelector('canvas'),
      songNameEl: document.querySelector('#song-name'),
      progressBarEl: document.querySelector('input#progress-bar'),
    });
    game.Start();
  </script>
</body>
